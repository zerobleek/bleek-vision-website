#
# Runs on every push to main:
#   1. Purges Cloudflare CDN cache
#   2. Pings Google sitemap
#   3. Submits to IndexNow (Bing, Yandex, DuckDuckGo)
#   4. Pings Bing sitemap directly

name: Deploy — Purge Cache & Notify Search Engines

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Purge & ping
    runs-on: ubuntu-latest

    steps:
      - name: Purge Cloudflare cache
        run: |
          echo "Purging Cloudflare CDN..."
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_CACHE_PURGE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything":true}' | python3 -c "import json,sys; r=json.load(sys.stdin); print('Cloudflare purge:', 'OK' if r['success'] else r['errors'])"

      - name: Ping Google sitemap
        run: |
          echo "Pinging Google..."
          curl -s "https://www.google.com/ping?sitemap=https://bleekvision.com/sitemap.xml" \
            -o /dev/null -w "Google: HTTP %{http_code}\n"

      - name: Submit to IndexNow (Bing, Yandex, DuckDuckGo)
        run: |
          echo "Submitting to IndexNow..."
          curl -s -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{"host":"bleekvision.com","key":"bc05497c4b12b8e6ee8e30f4d3a78a6c","keyLocation":"https://bleekvision.com/bc05497c4b12b8e6ee8e30f4d3a78a6c.txt","urlList":["https://bleekvision.com/"]}' \
            -o /dev/null -w "IndexNow: HTTP %{http_code}\n"

      - name: Ping Bing sitemap
        run: |
          echo "Pinging Bing..."
          curl -s "https://ssl.bing.com/webmaster/ping.aspx?siteMap=https://bleekvision.com/sitemap.xml" \
            -o /dev/null -w "Bing: HTTP %{http_code}\n"

      - name: Done
        run: echo "Cache purged and all search engines notified for bleekvision.com"
